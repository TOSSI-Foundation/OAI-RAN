# Transparent LEO NTN UE for the OCUDU gNB over the rfsimulator.
#
# The UE applies the DOWNLINK channel itself, through OAI's own SAT_LEO_TRANS model, which is what both working
# reference testbeds do: OAI's gNB+UE rfsim pairing, and the older OCUDU+OAI ZMQ one where the whole channel
# lived in the UE's ZMQ device. The gNB applies only the uplink leg. Trying to impose the downlink from the
# gNB's transmit carrier instead stopped SIB1 decoding outright, even at 1.3 kHz.
#
# SAT_LEO_TRANS hardcodes a 600 km circular polar orbit over a spherical earth of 6377900 m, starting at the
# horizon when the UE connects. configs/ntn/leo_rfsim_gnb.yml is set to the same point in the same pass so the
# ephemeris the gNB broadcasts in SIB19 and the channel the UE flies through agree.
#
# position0 is OAI's own ground-station point for that model, the pole, expressed on WGS84 so it matches the
# gNB's reference_location.

uicc0 = {
  imsi = "001010000000002";
  key  = "fec86ba6eb707ed08905757b1bb44b8f";
  opc  = "C42449363BBAD02B66D16BC975D77CC1";
  pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; nssai_sd = 1; });
}

position0 = {
    x = 0.0;
    y = 0.0;
    z = 6356752.314;
}

@include "channelmod_rfsimu_LEO_satellite.conf"

# Test harness for Multi-RTT phase 2: tell the OAI UE's PRS estimator where the gNB's DL-PRS is, mirroring
# configs/ntn/leo_nrppa.yml. (The standard route is LPP ProvideAssistanceData - phase 3.)
PRSs =
(
  {
    Active_gNBs = 1;
    prs_config0 = (
    {
      gNB_id = 0;
      NumPRSResources       = 1;
      PRSResourceSetPeriod  = [160, 5];
      SymbolStart           = [4];
      NumPRSSymbols         = [4];
      NumRB                 = 48;
      RBOffset              = 0;
      CombSize              = 4;
      REOffset              = [0];
      PRSResourceOffset     = [0];
      PRSResourceRepetition = 1;
      PRSResourceTimeGap    = 1;
      NPRS_ID               = [1];
      MutingPattern1        = [];
      MutingPattern2        = [];
      MutingBitRepetition   = 1;
    }
    );
  }
);
